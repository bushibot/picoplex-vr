<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>PicoPlex VR</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #eee; overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #stage canvas { display: block; }
    #overlay { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center;
      background: rgba(20,20,26,.88); padding: 14px 18px; border-radius: 16px; max-width: calc(100% - 32px); box-sizing: border-box; }
    #overlay.hidden { display: none; }
    #overlay button { font: 600 18px system-ui, sans-serif; padding: 12px 22px; border-radius: 12px; border: 0; cursor: pointer;
      background: #e5a00d; color: #111; }
    #overlay button.secondary { background: #2f3140; color: #eee; }
    #status { font-size: 14px; color: #aaa; max-width: 520px; }
    video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  </style>
  <script src="vendor/hls.min.js"></script>
</head>
<body>
  <div id="stage"></div>
  <div id="overlay">
    <button id="enter-vr" hidden>Enter VR</button>
    <button id="enter-ar" class="secondary" hidden>Enter Passthrough</button>
    <button id="hide-overlay" class="secondary">Hide</button>
    <span id="status"></span>
  </div>
  <video id="video" playsinline crossorigin="anonymous" preload="auto"></video>
  <script type="module" src="js/main.js"></script>
</body>
</html>
